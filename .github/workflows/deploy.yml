name: Deploy Next.js site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Pushes the static export to the gh-pages branch (see peaceiris/actions-gh-pages).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Project site URL: https://<user>.github.io/<repo>/
      - name: Set Pages base path
        id: pages_base
        run: |
          BASE_PATH="/${{ github.event.repository.name }}"
          echo "base_path=${BASE_PATH}" >> "$GITHUB_OUTPUT"
          echo "Pages base path: ${BASE_PATH}"

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build with Next.js
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages_base.outputs.base_path }}

      - name: Publish static site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
