name: Deploy Next.js site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Project site URL: https://<user>.github.io/<repo>/
      - name: Set Pages base path
        id: pages_base
        run: |
          BASE_PATH="/${{ github.event.repository.name }}"
          echo "base_path=${BASE_PATH}" >> "$GITHUB_OUTPUT"
          echo "Pages base path: ${BASE_PATH}"

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build with Next.js
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages_base.outputs.base_path }}

      # This repo's Pages site is built from the default branch root (GitHub's
      # "pages build & deployment" / README mode). Copy the static export beside
      # source so index.html wins over README.md. .nojekyll disables Jekyll.
      - name: Sync static export to repository root
        run: |
          cp -R out/. .
          touch .nojekyll

      - name: Commit and push static site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .nojekyll
          for item in $(ls -A out); do
            git add -f "$item"
          done
          if git diff --staged --quiet; then
            echo "No static files to publish."
            exit 0
          fi
          git commit -m "chore: publish static site for GitHub Pages [skip ci]"
          git push
